name: Windows browser smoke test
on:
  push:
    branches: [qa/windows-smoke]
permissions:
  contents: read
jobs:
  edge:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install browser test driver
        shell: pwsh
        run: |
          npm.cmd install --prefix "$env:RUNNER_TEMP/clinic-qa" --no-audit --no-fund --ignore-scripts playwright@1.56.1
      - name: Exercise offline pages in Microsoft Edge
        shell: pwsh
        run: |
          $env:CLINIC_PLAYWRIGHT = "$env:RUNNER_TEMP/clinic-qa/node_modules/playwright"
          node tests/windows-smoke.cjs
